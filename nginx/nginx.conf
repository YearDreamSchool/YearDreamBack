events {
    worker_connections 1024;
}

http {
    upstream spring_app {
        server app:8080;
    }

    # === 1. HTTP → HTTPS 리디렉션 (두 도메인 모두) ===
    server {
        listen 80;
        server_name yeardream.site yeardream.codns.com;
        return 301 https://yeardream.site$request_uri;
    }

    # === 2. HTTPS 프록시 (백엔드 + 쿠키 공유) ===
    server {
        listen 443 ssl;
        server_name yeardream.site yeardream.codns.com;  # 두 도메인 허용

        ssl_certificate /etc/nginx/certs/live/yeardream.codns.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/yeardream.codns.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # --- Refresh Token API 전용 경로 (안정성 향상) ---
        location /api/token/refresh {
            proxy_pass http://spring_app/api/token/refresh;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # 핵심: .yeardream.site 쿠키를 이 도메인에서도 받게 함
            proxy_cookie_domain .yeardream.site yeardream.codns.com;
        }

        # --- 모든 나머지 경로 (기존 동작 유지) ---
        location / {
            proxy_pass http://spring_app;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_redirect off;

            # 모든 경로에서도 쿠키 공유 (백업)
            proxy_cookie_domain .yeardream.site yeardream.codns.com;
        }
    }
}